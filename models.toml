# Model registry — the single place to add a model.
#
# Adding a model: drop the GGUF into GGUF_DIR, add a [[model]] block here, then
#   python src/run.py models            # verify file found + inspect architecture
#   python src/run.py register <id>     # only if benchmarking via Ollama
#   python src/run.py bench <id>
#
# Fields:
#   id          short unique id used on the CLI, in CSVs and on the dashboard
#   name        display name ("Family Size Variant (QUANT)") — quant in parens is parsed by the dashboard
#   file        GGUF filename relative to GGUF_DIR
#   source      where the file came from (Hugging Face repo) — documentation only
#   include     optional, default true; false keeps the model registered (old data stays valid)
#               but run-all skips it unless named with --models
#   ollama_tag  optional, defaults to "eval/<id>"
#   moe         optional — auto-detected from GGUF metadata (expert_count > 0); set only to override
#
# Decision models (Clef, Kev, Laya, ...) are detected from GGUF metadata ({arch}.decision.type)
# and are benchmarked with `run.py decide` via llama-server's /v1/systemone endpoint.
#
# Order here is the dashboard row order. Model set chosen 2026-10-05 (see docs/paper/OUTLINE.md).

# ── Study set: general LLMs ───────────────────────────────────────────────────

[[model]]
id     = "qwen3.8-27b-q4"
name   = "Qwen3.8 27B (Q4_K_M)"
file   = "Qwen3.8-27B-Q4_K_M.gguf"
source = "ggml-org/Qwen3.8-27B-GGUF"           # same converter + quant as Clef (its base model)

[[model]]
