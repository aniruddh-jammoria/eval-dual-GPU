# Model registry — the single place to add a model.
#
# Adding a model: drop the GGUF into GGUF_DIR, add a [[model]] block here, then
#   python src/run.py models            # verify file found + inspect architecture
#   python src/run.py register <id>     # only if benchmarking via Ollama
#   python src/run.py bench <id>
#
# Fields:
#   id          short unique id used on the CLI, in CSVs and on the dashboard
#   name        display name ("Family Size Variant (QUANT)") — quant in parens is parsed by the dashboard
#   file        GGUF filename relative to GGUF_DIR
#   ollama_tag  optional, defaults to "eval/<id>"
#   moe         optional — auto-detected from GGUF metadata (expert_count > 0); set only to override
#
# Order here is the dashboard row order.

[[model]]
id   = "gemma4-12b-qat"
name = "Gemma 4 12B IT QAT (Q4_0)"
file = "gemma-4-12b-it-qat-q4_0.gguf"

